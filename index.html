<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>狼人杀 · 陈婧霏版</title><meta name="description" content="陈婧霏版狼人杀，洗牌、抽牌，揭晓今晚的身份。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238c242c'/%3E%3Cpath d='M4 16Q16 2 28 16Q16 30 4 16' fill='%23f4d98f' stroke='%231f171b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%237571a8'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./">FAYE<span>1219</span></a><span class="edition">SCARLET WITCH EDITION</span><span class="tag">SCARLET WITCH edition</span></header>
<main><section class="heading"><div><p class="eyebrow">THE NIGHT IS YOURS</p><h1>狼人杀<span>抽张牌，入夜。</span></h1></div><div class="issue">WEREWOLF<br><b>谁是今晚的你？</b></div></section>
<section class="table" aria-label="抽牌桌"><div class="table-top"><span class="night">☾ 天黑，请抽牌</span><span id="count">剩余 5 / 5 张</span></div><div class="deck" id="deck"></div><div class="table-bottom"><p id="hint" aria-live="polite">凭直觉，选一张属于你的身份牌。</p><button class="shuffle" id="shuffle">↻ 重新洗牌</button></div></section>
<section class="configuration" aria-label="自定义牌组"><div class="config-title"><h2>今晚的阵容</h2><span>每种角色数量由你决定</span></div><form id="config"><div class="role-inputs" id="role-inputs"></div><div class="config-bottom"><span id="total">共 5 位玩家</span><button class="shuffle" type="submit">应用配置 · 开始新一轮</button></div><p id="config-error" role="alert"></p></form></section><footer><span>陈婧霏版 · 狼人杀</span><span>KEEP YOUR SECRET.</span></footer></main>
<dialog id="reveal"><div class="reveal-content"><div class="secret"><span>仅自己查看</span><button id="close" aria-label="收起身份牌">×</button></div><div class="flip" id="flip"><div class="flip-inner"><img class="back" src="assets/back.webp" alt="卡背"><img class="front" id="front" alt=""></div></div><div class="identity" aria-live="polite"><p>今晚，你的身份是</p><h2 id="role"></h2></div><button class="next" id="next">记住了，收起身份</button><p class="privacy">收起后，再交给下一位玩家。</p></div></dialog>
<dialog id="confirm"><div class="confirm-content"><p class="eyebrow">A NEW NIGHT</p><h2>开始新一轮？</h2><p>当前身份牌将全部收回，并按配置重新洗牌。</p><div><button id="cancel">继续本轮</button><button id="restart" class="next">重新洗牌</button></div></div></dialog>
<script src="app.js"></script></body></html>
